name: Build Windows and AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl-viewer-windows
          path: build/Release/stl-viewer.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/stl-viewer.exe

  appimage:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      OUTPUT: STL_Viewer-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git file imagemagick \
            libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libdbus-1-dev

      - name: Build
        run: |
          # Use the desktop portal so GTK is not bundled
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNFD_PORTAL=ON
          cmake --build build --parallel

      - name: Prepare AppImage files
        run: |
          convert icon.png -resize 256x256 -background none -gravity center \
            -extent 256x256 stl-viewer.png

          cat > stl-viewer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=STL Viewer
          Comment=View STL 3D models
          Exec=stl-viewer %f
          Icon=stl-viewer
          Terminal=false
          Categories=Graphics;Viewer;
          EOF
          sed -i 's/^[[:space:]]*//' stl-viewer.desktop

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/stl-viewer \
            --desktop-file stl-viewer.desktop \
            --icon-file stl-viewer.png \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl-viewer-appimage
          path: STL_Viewer-x86_64.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: STL_Viewer-x86_64.AppImage